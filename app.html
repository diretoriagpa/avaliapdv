<style>
:root{--azul:#016ab6;--ciano:#00d2f4;--verde:#88e800;--ouro:#ffb81c;--laranja:#f58424;--magenta:#dc0847;--bg:#f2f8fc;--card:#fff;--txt:#123a55;--mut:#6b8ba3;--ok:#3aa657;--warn:#e0a800;--err:#d64545}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--txt);padding-bottom:76px}
header{background:linear-gradient(120deg,var(--azul),#0096d6);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(1,106,182,.35)}
header .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:17px;font-weight:800;letter-spacing:.2px}
header .sub{font-size:11px;opacity:.85;margin-top:2px}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:rgba(255,255,255,.14);border:0;color:#fff;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:#fff;color:var(--azul)}
main{max-width:1080px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(18,58,85,.08)}
.card h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--ciano);flex:0 0 auto}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:linear-gradient(135deg,#eaf6ff,#f7fcff);border-radius:14px;padding:12px;border:1px solid #dceefb}
.kpi .lbl{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:20px;font-weight:800;color:var(--azul);margin-top:3px}
.kpi .sm{font-size:11px;color:var(--mut);margin-top:2px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid #d5e6f2;border-radius:11px;font-size:14px;background:#fbfdff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ciano)}
.btn{display:inline-block;border:0;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;background:var(--azul);color:#fff}
.btn.sec{background:#e8f3fb;color:var(--azul)}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.err{background:var(--err)}.btn.org{background:var(--laranja)}
.btn.sm{padding:5px 11px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:7px 8px;border-bottom:2px solid #e3eef7}
td{padding:8px;border-bottom:1px solid #eef5fa;vertical-align:top}
tr:hover td{background:#f6fbff}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.t-ok{background:#e3f6e8;color:var(--ok)}.t-warn{background:#fdf3d7;color:#a07800}.t-err{background:#fde3e3;color:var(--err)}.t-info{background:#e0f4fd;color:#0083b8}.t-mut{background:#eef2f5;color:var(--mut)}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:18px}
.bar{height:9px;background:#e6eff6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ciano),var(--azul));border-radius:99px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:0;background:#e3eef7;color:var(--azul);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer}
.subtabs button.on{background:var(--azul);color:#fff}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(18,58,85,.12);z-index:60}
.bottomnav button{border:0;background:none;font-size:10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:600;padding:2px 6px;border-radius:10px}
.bottomnav button.on{color:var(--azul)}
.bottomnav .ic{font-size:19px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid #e3eef7;border-radius:12px;margin-bottom:8px}
.chk .body{flex:1}
.chk .t{font-weight:700;font-size:13.5px}
.chk .m{font-size:11.5px;color:var(--mut);margin-top:2px}
.fotothumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid var(--ciano)}
.modalbg{position:fixed;inset:0;background:rgba(10,40,60,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.modal h3{margin-bottom:8px;font-size:16px}
.login{max-width:380px;margin:8vh auto}
.big{font-size:26px;font-weight:800;color:var(--azul)}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{text-align:right}
.mut{color:var(--mut);font-size:12px}
hr{border:0;border-top:1px solid #e8f1f7;margin:10px 0}
#printarea{display:none}
@media print{
 body>*{display:none!important}
 body{padding:0;background:#fff}
 #printarea{display:block!important;font-size:12px}
 #printarea table{width:100%;border-collapse:collapse}
 #printarea th,#printarea td{border:1px solid #999;padding:4px 6px;font-size:11px}
 #printarea h1{font-size:17px;color:#016ab6}#printarea h2{font-size:14px;margin:12px 0 6px}
 #printarea .ph{display:flex;justify-content:space-between;border-bottom:2px solid #016ab6;padding-bottom:6px;margin-bottom:10px;font-size:10px;color:#555}
}
@media(max-width:640px){ main{padding:10px} .hide-m{display:none} }
</style>

<script>
/* ---------- helpers de render ---------- */
function selPDV(id){return `<select onchange="${id}fn=this.value">${S.pdvs.filter(p=>p.ativo).map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select>`}
function opt(v,cur){return `<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`}
function badgeStatus(st){const m={rascunho:['t-mut','Rascunho'],lancado:['t-info','Lançado'],conciliado:['t-ok','Conciliado'],previsto:['t-warn','Previsto'],pago:['t-ok','Pago'],estornado:['t-err','Estornado'],pendente:['t-warn','Pendente'],validado:['t-ok','Validado'],concluido:['t-info','Concluído'],aberta:['t-warn','Aberta'],fechada:['t-ok','Fechada']};const x=m[st]||['t-mut',st];return `<span class="tag ${x[0]}">${x[1]}</span>`}

/* ---------- PAINEL ---------- */
function painelHTML(){
 const mes=mesAtual();
 const ents=S.ents.filter(e=>e.data.startsWith(mes)&&e.status!=='estornado');
 const deds=S.deds.filter(d=>d.data.startsWith(mes)&&d.status!=='estornado');
 const sais=S.sais.filter(s=>s.data.startsWith(mes)&&s.status!=='estornado');
 const bruto=ents.reduce((a,e)=>a+e.valor,0), ded=deds.reduce((a,d)=>a+d.valor,0), sai=sais.reduce((a,s)=>a+s.valor,0);
 const liq=bruto-ded, saldo=liq-sai;
 const roi=sai>0?(saldo/sai*100):0;
 const pendChk=S.lancs.filter(l=>l.data.startsWith(mes)&&l.status!=='validado').length;
 const pdvsSemHoje=S.pdvs.filter(p=>p.ativo&&!S.ents.some(e=>e.pdv===p.id&&e.data===hoje()));
 const cap=S.apur.find(a=>a.mes===mes);
 return `
 <div class="card"><h2><span class="dot"></span>Resumo do mês — ${mes}</h2>
  <div class="grid g3">
   <div class="kpi"><div class="lbl">Faturamento bruto</div><div class="val">${fmtM(bruto)}</div><div class="sm">${ents.length} lançamentos</div></div>
   <div class="kpi"><div class="lbl">Deduções</div><div class="val">${fmtM(ded)}</div><div class="sm">taxas, estornos, devoluções</div></div>
   <div class="kpi"><div class="lbl">Líquido elegível</div><div class="val">${fmtM(liq)}</div><div class="sm">base do pool (5%)</div></div>
   <div class="kpi"><div class="lbl">Saídas do mês</div><div class="val">${fmtM(sai)}</div><div class="sm">${sais.length} lançamentos</div></div>
   <div class="kpi"><div class="lbl">Resultado operacional</div><div class="val" style="color:${saldo>=0?'var(--ok)':'var(--err)'}">${fmtM(saldo)}</div><div class="sm">líquido − saídas</div></div>
   <div class="kpi"><div class="lbl">Prévia do ROI</div><div class="val" style="color:${roi>=S.params.roiMinimo?'var(--ok)':'var(--err)'}">${roi.toFixed(1)}%</div><div class="sm">gatilho: ${S.params.roiMinimo}% ${roi>=S.params.roiMinimo?'✅':'⛔'}</div></div>
  </div>
  ${cap?`<hr><div class="flex"><span class="tag ${cap.status==='fechada'?'t-ok':'t-warn'}">Apuração ${cap.status==='fechada'?'fechada':'aberta'}</span><span class="mut">ROI apurado: ${cap.roi.toFixed(1)}% · Pool: ${fmtM(cap.pool)}</span></div>`:''}
 </div>
 <div class="grid g2">
  <div class="card"><h2><span class="dot"></span>Pendências de hoje</h2>
   ${pdvsSemHoje.length?`<p class="mut">PDVs sem lançamento de faturamento hoje:</p><div class="flex" style="margin-top:6px">${pdvsSemHoje.map(p=>`<span class="tag t-warn">${esc(p.nome)}</span>`).join('')}</div>`:'<p class="mut">Todos os PDVs ativos lançaram faturamento hoje. ✅</p>'}
   <hr><div class="flex"><span class="tag ${pendChk?'t-warn':'t-ok'}">${pendChk} checklists pendentes de validação</span></div>
  </div>
  ${pode('*')?`<div class="card"><h2><span class="dot"></span>Atalhos rápidos</h2>
   <div class="flex">
    <button class="btn org" onclick="go('fin','ent')">💵 Lançar faturamento</button>
    <button class="btn" onclick="go('lanc')">✅ Checklist do dia</button>
    <button class="btn sec" onclick="go('fin','sai')">🧾 Lançar saída</button>
    <button class="btn sec" onclick="go('desp')">🗑️ Desperdício</button>
   </div>
  </div>`:`<div class="card"><h2><span class="dot"></span>Seu papel neste app</h2>
   <p class="mut">Perfil <b>${PERFIS[eu()?.perfil]||''}</b> — ${eu()?.perfil==='diretoria'?'acompanhamento mensal em modo leitura: veja o resumo financeiro, a apuração e os relatórios. Lançamentos são feitos exclusivamente pelo Gerente de A&B.':'verificação e conferência dos lançamentos do Gerente de A&B: valide checklists e ocorrências, concilie o financeiro e feche a apuração mensal.'}</p>
   <div class="flex" style="margin-top:8px"><button class="btn sec" onclick="go('apur')">📊 Ver apuração</button><button class="btn sec" onclick="go('rel')">📄 Relatórios (PDF)</button></div>
  </div>`}
 </div>
 <div class="card"><h2><span class="dot"></span>Fluxo de trabalho</h2>
  <table><tr><th>Etapa</th><th>Quem faz</th><th>Onde</th></tr>
  <tr><td>Checklists, ocorrências, desperdício e financeiro</td><td><b>Gerente de A&B</b></td><td>Check · Financ. · Desperdício</td></tr>
  <tr><td>Validação de checklists e ocorrências</td><td><b>Validação e Auditoria</b></td><td>Check → Validar · Equipe → Validar</td></tr>
  <tr><td>Conciliação financeira</td><td><b>Validação e Auditoria</b></td><td>Financ. → Conciliação</td></tr>
  <tr><td>Fechamento da apuração e comissões</td><td><b>Validação e Auditoria</b></td><td>Apuração → Fechar</td></tr>
  <tr><td>Acompanhamento mensal e conferência</td><td><b>Diretoria</b></td><td>Painel · Apuração · Relatórios (leitura)</td></tr>
  </table></div>
 <div class="card"><h2><span class="dot"></span>Última apuração</h2>${apurResumoHTML()}</div>`;
}

/* ---------- LANÇAMENTOS DIÁRIOS (checklist) ---------- */
function lancHTML(){
 if(!S.forms.length)return '<div class="card empty">Cadastre um formulário de qualidade em Cadastros.</div>';
 const form=S.forms[0];
 const itens=S.itens.filter(i=>i.form===form.id&&i.ativo!==false);
 const pdvSel=SUB.lancPDV||S.pdvs[0]?.id;
 const dataSel=SUB.lancData||hoje();
 const existente=S.lancs.find(l=>l.pdv===pdvSel&&l.data===dataSel);
 return `
 <div class="card"><h2><span class="dot"></span>Checklist diário de qualidade</h2>
  <div class="row">
   <div><label>PDV</label><select onchange="SUB.lancPDV=this.value;render()">${S.pdvs.filter(p=>p.ativo).map(p=>`<option value="${p.id}" ${p.id===pdvSel?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></div>
   <div><label>Data</label><input type="date" value="${dataSel}" onchange="SUB.lancData=this.value;render()"></div>
   <div><label>Formulário</label><select disabled><option>${esc(form.nome)} v${form.versao}</option></select></div>
  </div>
  ${existente?`<div class="flex" style="margin-top:10px"><span class="tag ${existente.status==='validado'?'t-ok':'t-warn'}">Lançamento existente: ${existente.status}</span>
   ${existente.status==='validado'?'<span class="mut">🔒 Bloqueado — retificação formal apenas.</span>':(pode('*')?`<button class="btn sm err" onclick="excluirLanc('${existente.id}')">Excluir rascunho</button>`:'')}
   ${existente.status!=='validado'&&pode('validar')?`<button class="btn sm ok" onclick="validarLanc('${existente.id}')">✔️ Validar checklist</button>`:''}</div>`:''}
 </div>
 <div class="card">
  ${itens.map(i=>chkItemHTML(i,existente)).join('')}
  ${existente&&existente.status==='validado'?'':(pode('*')?`<div class="flex" style="margin-top:10px">
   <button class="btn sec" onclick="salvarLanc('rascunho')">💾 Salvar rascunho</button>
   <button class="btn ok" onclick="salvarLanc('concluido')">✅ Concluir lançamento</button></div>
   <p class="mut" style="margin-top:8px">Itens com 📷 exigem foto obrigatória para concluir. Perda proporcional calculada automaticamente.</p>`:'<p class="mut" style="margin-top:8px">🔒 Somente o Gerente de A&B preenche o checklist. Seu perfil acompanha em leitura.</p>')}
 </div>`+(S.pdvs.some(p=>p.formato==='terceirizado')?fichaTercHTML():'');
}
function chkItemHTML(i,lanc){
 const st=lanc?lanc.itens[i.id]:null;
 const feito=st?st.feito:false;
 const fotos=(st&&st.fotos)||[];
 return `<div class="chk">
  <input type="checkbox" ${feito?'checked':''} ${lanc&&lanc.status==='validado'?'disabled':''} ${pode('*')?'':'disabled'} onchange="toggleItem('${i.id}',this.checked)" style="width:20px;height:20px;margin-top:2px">
  <div class="body"><div class="t">${esc(i.desc)}</div>
   <div class="m">Dimensão: ${DIMS[i.criterio]||i.criterio} · Perda se não realizado: ${i.peso} pts ${i.exigeFoto?'· 📷 foto obrigatória':''}</div>
   ${feito||!i.exigeFoto?'':`<div class="tag t-err" style="margin-top:4px">Foto obrigatória pendente</div>`}
   <div class="flex" style="margin-top:6px">
    ${fotos.map((f,ix)=>`<img class="fotothumb" src="${f}">`).join('')}
    <label class="btn sm sec" style="cursor:pointer">📷 Anexar<input type="file" accept="image/*" hidden onchange="addFoto('${i.id}',this)"></label>
   </div>
  </div></div>`;
}
function fichaTercHTML(){
 const terc=S.pdvs.filter(p=>p.ativo&&p.formato==='terceirizado');
 const pdvSel=SUB.fichaPDV||terc[0]?.id;
 const dataSel=SUB.fichaData||hoje();
 const ex=(S.fichas||[]).find(f=>f.pdv===pdvSel&&f.data===dataSel);
 const vals=ex?ex.valores:{};
 const total=Object.keys(FORM_TER).reduce((a,k)=>a+(vals[k]??FORM_TER[k][1]),0);
 return `
 <div class="card"><h2><span class="dot"></span>Ficha de avaliação — PDV terceirizado (padrão contrato, cláusula 15 + RDC 216)</h2>
  <div class="row">
   <div><label>PDV terceirizado</label><select onchange="SUB.fichaPDV=this.value;render()">${terc.map(p=>`<option value="${p.id}" ${p.id===pdvSel?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></div>
   <div><label>Data da avaliação</label><input type="date" value="${dataSel}" onchange="SUB.fichaData=this.value;render()"></div>
  </div>
  ${ex?`<div class="flex" style="margin-top:8px"><span class="tag ${total>=90?'t-ok':total>=70?'t-warn':'t-err'}">Nota atual: ${total}/100</span>
   ${ex.status==='validado'?'<span class="mut">🔒 Validada</span>':(pode('validar')?`<button class="btn sm ok" onclick="validarFicha('${ex.id}')">Validar ficha</button>`:'')}</div>`:''}
  <table style="margin-top:10px"><tr><th>Exigência do contrato</th><th>Peso</th><th>Nota</th><th>Perda</th></tr>
  ${Object.entries(FORM_TER).map(([k,[desc,peso]])=>{const v=vals[k]??peso;const perda=peso-v;
  return `<tr><td>${esc(desc)}</td><td>${peso}</td><td><input type="number" min="0" max="${peso}" step="0.5" value="${v}" ${ex&&ex.status==='validado'?'disabled':''} onchange="notaFicha('${k}',this.value)" style="width:80px"></td><td>${perda>0?'<span class="tag t-warn">−'+perda+'</span>':'<span class="tag t-ok">OK</span>'}</td></tr>`}).join('')}
  <tr><td><b>TOTAL</b></td><td>100</td><td><b>${total}</b></td><td>${total>=90?'<span class="tag t-ok">Superior</span>':total>=70?'<span class="tag t-warn">Em recuperação</span>':'<span class="tag t-err">Crítico — aciona exigências/multa</span>'}</td></tr>
  </table>
  <p class="mut" style="margin-top:6px">Nota < 70 ou exigência grave (higiene/validade/pragas) → notificação com prazo (48h para defesa, cláusula 15.7) e multa na aba Repasse: Leve R$ 300 · Grave R$ 3.000 · Gravíssima R$ 5.000 + rescisão. Avaliações NÃO incidem no bolsão de comissões dos colaboradores.</p>
  <div class="flex" style="margin-top:8px">
   ${pode('*')?`<button class="btn" onclick="salvarFicha()">💾 Salvar ficha</button>`:''}
   <button class="btn sec" onclick="pdfFichaTerc('${pdvSel}','${dataSel}')">📄 Relatório de exigências (PDF)</button>
  </div>
 </div>`;
}
function notaFicha(k,v){SUB._ficha=SUB._ficha||{};SUB._ficha[k]=parseFloat(v)||0}
function salvarFicha(){
 if(!pode('*'))return alert('Somente o Gerente de A&B preenche a ficha.');
 const pdv=SUB.fichaPDV||S.pdvs.find(p=>p.formato==='terceirizado')?.id,data=SUB.fichaData||hoje();
 let ex=(S.fichas||[]).find(f=>f.pdv===pdv&&f.data===data);
 const valores={};Object.keys(FORM_TER).forEach(k=>valores[k]=SUB._ficha&&SUB._ficha[k]!=null?SUB._ficha[k]:(ex?ex.valores[k]:FORM_TER[k][1]));
 SUB._ficha=null;
 if(ex){ex.valores=valores}else{S.fichas=S.fichas||[];S.fichas.push({id:uid(),pdv,data,valores,status:'pendente',resp:S.usuario})}
 aud('Ficha de avaliação terceirizado',`${pdvById(pdv)?.nome} ${data}`);save();render();
}
function validarFicha(id){if(!pode('validar'))return alert('Sem permissão.');const f=S.fichas.find(x=>x.id===id);f.status='validado';f.validadoPor=S.usuario;aud('Validação','Ficha de avaliação validada');save();render()}
function pdfFichaTerc(pdvId,data){
 const ex=(S.fichas||[]).find(f=>f.pdv===pdvId&&f.data===data);
 const vals=ex?ex.valores:{};
 const total=Object.keys(FORM_TER).reduce((a,k)=>a+(vals[k]??FORM_TER[k][1]),0);
 const p=pdvById(pdvId);
 let rows='';Object.entries(FORM_TER).forEach(([k,[desc,peso]])=>{const v=vals[k]??peso;rows+=`<tr><td>${esc(desc)}</td><td>${peso}</td><td>${v}</td><td>${peso-v>0?'−'+(peso-v):'OK'}</td></tr>`});
 pdfDoc('Relatório de exigências — '+p.nome+' — '+fmtD(data),`
 <p><b>PDV:</b> ${esc(p.nome)} · <b>Data:</b> ${fmtD(data)} · <b>Avaliador:</b> ${esc(ex?nomeUsu():'—')} · <b>Nota:</b> <b>${total}/100</b> (${total>=90?'Superior':total>=70?'Em recuperação':'Crítico'})</p>
 <table><tr><th>Exigência (padrão do contrato — cláusulas 8/9/10/11/15 e RDC 216/2004)</th><th>Peso</th><th>Nota</th><th>Perda</th></tr>${rows}</table>
 <p style="font-size:11px;margin-top:10px"><b>Régua e consequências (cláusula 19):</b> multa Leve R$ 300,00 — desatendimentos rápidos, sem risco à saúde; multa Grave R$ 3.000,00 — risco à saúde (higiene, validade, pragas, EPI, telas, dedetização vencida); Gravíssima R$ 5.000,00 + rescisão — reincidência grave, exclusividade violada, manipulação irregular.<br>
 <b>Prazos (cláusula 15):</b> correção no prazo indicado na ficha · defesa em até 48h à administração · notificação de infração em caso de descumprimento.<br>
 <b>Desconto no repasse:</b> multas lançadas são descontadas no recibo semanal (cláusula 8.4).</p>`);
}
const FORM_TER={higiene:['Higiene e saúde dos manipuladores (uniforme, EPI, adornos, cabelo protegido)',15],
 local:['Limpeza e organização do local (piso, paredes, teto, lixo, objetos estranhos)',15],
 equip:['Equipamentos e utensílios em bom estado, higienizados e adequados',15],
 controle:['Controle de qualidade: validade, armazenamento e manipulação (RDC 216)',20],
 prazos:['Documentação em dia (alvará, licença sanitária, bombeiros, seguro, dedetização)',10],
 sistema:['Registro no sistema: item exato vendido, sem combinação de itens (cláusula 10)',10],
 atendimento:['Atendimento, uniformização e padrão visual "Lugar de gente feliz!"',10],
 exclusividade:['Respeito à exclusividade (açaí, picolé, sorvete, chopp) e às promoções do parque',5]};
function notaFicha(k,v){SUB._ficha=SUB._ficha||{};SUB._ficha[k]=parseFloat(v)||0}
function salvarFicha(){
 if(!pode('*'))return alert('Somente o Gerente de A&B preenche a ficha.');

 const valores={};Object.keys(FORM_TER).forEach(k=>valores[k]=SUB._ficha&&SUB._ficha[k]!=null?SUB._ficha[k]:(ex?ex.valores[k]:FORM_TER[k][1]));
 SUB._ficha=null;
 if(ex){ex.valores=valores}else{S.fichas=S.fichas||[];S.fichas.push({id:uid(),pdv,data,valores,status:'pendente',resp:S.usuario})}
 aud('Ficha de avaliação terceirizado',`${pdvById(pdv)?.nome} ${data}`);save();render();
}
function validarFicha(id){if(!pode('validar'))return alert('Sem permissão.');const f=S.fichas.find(x=>x.id===id);f.status='validado';f.validadoPor=S.usuario;aud('Validação','Ficha de avaliação validada');save();render()}
function pdfFichaTerc(pdvId,data){
 const ex=(S.fichas||[]).find(f=>f.pdv===pdvId&&f.data===data);
 const vals=ex?ex.valores:{};
 const total=Object.keys(FORM_TER).reduce((a,k)=>a+(vals[k]??FORM_TER[k][1]),0);
 const p=pdvById(pdvId);
 let rows='';Object.entries(FORM_TER).forEach(([k,[desc,peso]])=>{const v=vals[k]??peso;rows+=`<tr><td>${esc(desc)}</td><td>${peso}</td><td>${v}</td><td>${peso-v>0?'−'+(peso-v):'OK'}</td></tr>`});
 pdfDoc('Relatório de exigências — '+p.nome+' — '+fmtD(data),`
 <p><b>PDV:</b> ${esc(p.nome)} · <b>Data:</b> ${fmtD(data)} · <b>Avaliador:</b> ${esc(ex?nomeUsu():'—')} · <b>Nota:</b> <b>${total}/100</b> (${total>=90?'Superior':total>=70?'Em recuperação':'Crítico'})</p>
 <table><tr><th>Exigência (contrato — cláusulas 8/9/10/11/15 + RDC 216/2004)</th><th>Peso</th><th>Nota</th><th>Perda</th></tr>${rows}</table>
 <p style="font-size:11px;margin-top:10px"><b>Régua e consequências (cláusula 19):</b> multa Leve R$ 300,00 — desatendimento rápido, sem risco à saúde; multa Grave R$ 3.000,00 — risco à saúde (higiene, validade, pragas, EPI, telas, dedetização vencida); Gravíssima R$ 5.000,00 + rescisão — reincidência grave, exclusividade violada, manipulação irregular.<br>
 <b>Prazos (cláusula 15):</b> correção no prazo indicado na ficha · defesa em até 48h à administração · notificação de infração em caso de descumprimento.<br>
 <b>Desconto no repasse:</b> multas lançadas são descontadas no recibo semanal (cláusula 8.4).</p>`);

function toggleItem(id,v){
 if(!pode('*'))return;
 const pdv=SUB.lancPDV||S.pdvs[0]?.id,data=SUB.lancData||hoje();
 let l=S.lancs.find(x=>x.pdv===pdv&&x.data===data);
 if(!l){l={id:uid(),pdv,data,turno:'Único',func:S.usuario,status:'rascunho',itens:{},validadoPor:null};S.lancs.push(l)}
 if(l.status==='validado')return;
 l.itens[id]={feito:v,fotos:(l.itens[id]&&l.itens[id].fotos)||[]};save();
}
function addFoto(itemId,inp){
 if(!pode('*'))return;
 const f=inp.files[0];if(!f)return;
 const pdv=SUB.lancPDV||S.pdvs[0]?.id,data=SUB.lancData||hoje();
 let l=S.lancs.find(x=>x.pdv===pdv&&x.data===data);
 if(!l){l={id:uid(),pdv,data,turno:'Único',func:S.usuario,status:'rascunho',itens:{},validadoPor:null};S.lancs.push(l)}
 if(!l.itens[itemId])l.itens[itemId]={feito:false,fotos:[]};
 const r=new FileReader();
 r.onload=()=>{compressImg(r.result,900,d=>{l.itens[itemId].fotos.push(d);save();render()})};
 r.readAsDataURL(f);
}
function compressImg(dataUrl,maxW,cb){const img=new Image();img.onload=()=>{const sc=Math.min(1,maxW/img.width);const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.72))};img.src=dataUrl}
function salvarLanc(status){
 if(!pode('*'))return alert('Somente o Gerente de A&B lança o checklist.');
 const pdv=SUB.lancPDV||S.pdvs[0]?.id,data=SUB.lancData||hoje();
 const l=S.lancs.find(x=>x.pdv===pdv&&x.data===data);
 if(!l){alert('Marque ao menos um item do checklist.');return}
 const itens=S.itens.filter(i=>i.form===S.forms[0].id);
 for(const i of itens){const st=l.itens[i.id];
  if(i.exigeFoto&&st&&st.feito&&(!st.fotos||!st.fotos.length)){alert(`Item "${i.desc}" exige foto obrigatória.`);return}
  if(i.exigeFoto&&(!st||!st.feito)&&status==='concluido'){/* não realizado: ok, perda proporcional */}}

function calcRepasse(from,to){
 const inP=d=>d>=from&&d<=to;
 const terc=S.pdvs.filter(p=>p.ativo&&p.formato==='terceirizado');
 return terc.map(p=>{
  const bruto=S.ents.filter(e=>e.pdv===p.id&&inP(e.data)&&e.status!=='estornado').reduce((a,e)=>a+e.valor,0);
  const margem=bruto*(p.margemAuto||30)/100;
  const luzAll=S.sais.filter(s=>s.cat==='Energia'&&s.centro===p.id&&inP(s.data)&&s.status!=='estornado');
  const luz=luzAll.reduce((a,s)=>a+s.valor,0);
  const kwh=luzAll.reduce((a,s)=>a+(s.kwh||0),0);
  const outros=S.sais.filter(s=>s.centro===p.id&&inP(s.data)&&s.status!=='estornado'&&['Taxas','Outros'].includes(s.cat));
  const outrosT=outros.reduce((a,s)=>a+s.valor,0);
  const multas=S.multas.filter(m=>m.pdv===p.id&&inP(m.data)&&m.status!=='estornada');
  const multasT=multas.reduce((a,m)=>a+m.valor,0);
  const totalRetencoes=margem+luz+outrosT+multasT;
  let liquido=bruto-totalRetencoes;
  const abaixo=liquido<0;
  return {pdv:p,bruto,margem,luz,kwh,outros,outrosT,multas,multasT,totalRetencoes,liquido,abaixo};
 });
}

<script>
/* ---------- APURAÇÃO MENSAL E COMISSÕES ---------- */
function pontuacaoPDV(pdv,mes){
 const p=S.params,det={};
 // 1. Resultado Financeiro (35)
 const bruto=S.ents.filter(e=>e.pdv===pdv.id&&e.data.startsWith(mes)).reduce((a,e)=>a+e.valor,0);
 const ded=S.deds.filter(d=>d.pdv===pdv.id&&d.data.startsWith(mes)).reduce((a,d)=>a+d.valor,0);
 const liq=bruto-ded;
 const meta=pdv.meta||0;
 det.meta=meta>0?Math.round(p.pesos.fin*15/35*(Math.min(1,liq/meta))*100)/100:p.pesos.fin*15/35;
 const desp=S.desps.filter(d=>d.pdv===pdv.id&&d.data.startsWith(mes)).reduce((a,d)=>a+d.custo,0);
 const tolPct=p.toleranciaDesperdicio;
 const despPct=bruto>0?(desp/bruto*100):0;
 det.cmv=despPct<=tolPct?5:Math.max(0,5-(despPct-tolPct)*2);
 det.margem=p.pesos.fin*15/35; // margem real exige custo por PDV — mantido cheio salvo informação do Financeiro
 det.fin=Math.min(p.pesos.fin,det.meta+det.margem+det.cmv);
 // 2. Processos e Operação (30)
 const lancs=S.lancs.filter(l=>l.pdv===pdv.id&&l.data.startsWith(mes));
 const itens=S.itens.filter(i=>i.form===(S.forms[0]||{}).id);
 let chkMax=0,chkGot=0;
 lancs.forEach(l=>{if(l.status!=='validado'&&l.status!=='concluido')return;
  itens.forEach(i=>{const st=l.itens[i.id];if(!st)return;chkMax+=i.peso;if(st.feito)chkGot+=i.peso})});
 const chkPct=chkMax>0?chkGot/chkMax:1;
 det.checklist=15*chkPct;
 det.abertura=5;det.estoque=10; // detalhamento via itens com critério abertura/estoque:
 let abMax=0,abGot=0,esMax=0,esGot=0;
 lancs.forEach(l=>{if(l.status!=='validado'&&l.status!=='concluido')return;
  itens.forEach(i=>{const st=l.itens[i.id];if(!st)return;
   if(i.criterio==='abertura'){abMax+=i.peso;if(st.feito)abGot+=i.peso}
   if(i.criterio==='estoque'){esMax+=i.peso;if(st.feito)esGot+=i.peso}})});
 if(abMax>0)det.abertura=5*abGot/abMax;
 if(esMax>0)det.estoque=10*esGot/esMax;
 det.proc=Math.min(p.pesos.proc,det.checklist+det.abertura+det.estoque);
 // 3. Cliente e Qualidade (20) — reclamações procedentes registradas como ocorrência "Reclamação procedente"
 const recl=S.ocors.filter(o=>o.pdv===pdv.id&&o.tipo==='Reclamação procedente'&&o.data.startsWith(mes)&&o.status==='validado').length;
 det.cliente=Math.max(0,p.pesos.cli-recl*p.reclamacaoPerda);
 // 4. Pessoas e Disciplina (15) — ausência em treinamento oficial: perda integral dos 10 pts (v2.0)
 const funcsDoPdv=S.funcs.filter(f=>f.ativo&&(f.pdvs||[]).includes(pdv.id));
 const treinFaltou=funcsDoPdv.some(f=>S.ocors.some(o=>o.func===f.id&&o.tipo.includes('treinamento oficial')&&o.data.startsWith(mes)&&o.status==='validado'));
 det.trein=treinFaltou?0:10;
 det.pes=Math.min(p.pesos.pes,det.trein+5);
 const total=Math.max(0,Math.min(100,det.fin+det.proc+det.cliente+det.pes));
 return {total,det,bruto,ded,liq,desp,despPct};
}
function pontosLiquidos(func,mes){
 const p=S.params;
 const oc=S.ocors.filter(o=>o.func===func.id&&o.data.startsWith(mes)&&o.status==='validado');
 let ded=0,fraude=false;
 oc.forEach(o=>{
  const t=o.tipo||'';
  if(t.includes('(leve)'))ded+=p.dedFaltaLeve;
  else if(t.includes('(média)'))ded+=p.dedFaltaMedia;
  else if(t.includes('(grave funcional)')||t.includes('(grave)'))ded+=p.dedFaltaGrave;
  else if(t.includes('(gravíssima)'))fraude=true;
  else if(o.deducao)ded+=o.deducao;
 });
 return {nominais:pontosNom(func),deducoes:Math.round(ded*10)/10,liquidos:Math.max(0,Math.round((pontosNom(func)-ded)*10)/10),fraude};
}
function apuracaoCalculo(mes){
 const p=S.params;
 const bruto=S.ents.filter(e=>e.data.startsWith(mes)&&e.status!=='estornado').reduce((a,e)=>a+e.valor,0);
 const ded=S.deds.filter(d=>d.data.startsWith(mes)&&d.status!=='estornado').reduce((a,d)=>a+d.valor,0);
 const sai=S.sais.filter(s=>s.data.startsWith(mes)&&s.status!=='estornado').reduce((a,s)=>a+s.valor,0);
 const liq=bruto-ded, res=liq-sai;
 const roi=sai>0?(res/sai*100):null;
 const roiOk=roi!==null&&roi>=p.roiMinimo;
 const pool=roiOk?liq*p.poolPct/100:0;
 const pdvsCalc=S.pdvs.filter(x=>x.ativo).map(pdv=>{const c=pontuacaoPDV(pdv,mes);return{pdv,...c,idcFator:fatorIDC(c.total)}});
 // elegíveis ao pool: flag do funcionário (base: gerente + colaboradores; diretoria/validação fora)
 const elegiveis=S.funcs.filter(f=>f.ativo&&f.elegivelComissao);
 const somaPontos=elegiveis.reduce((a,f)=>a+pontosNom(f),0)||1;
 const vPonto=pool/somaPontos;
 const linhas=elegiveis.map(f=>{
  const pl=pontosLiquidos(f,mes);
  const pdvPrin=f.pdvs&&f.pdvs[0]?pdvsCalc.find(x=>x.pdv.id===f.pdvs[0]):null;
  return {func:f,pontosNominais:pl.nominais,deducoes:pl.deducoes,pontosLiquidos:pl.liquidos,valorPonto:vPonto,
   comissao:pl.fraude?0:vPonto*pl.liquidos,fraude:pl.fraude,pdv:pdvPrin?pdvPrin.pdv.nome:'A&B geral'};
 });
 const totalComissao=linhas.reduce((a,l)=>a+l.comissao,0);
 return {mes,bruto,ded,liq,sai,res,roi,roiOk,pool,somaPontos,vPonto,pdvsCalc,linhas,totalComissao};
}

/* ---------- importação CSV (materiais e fornecedores) ---------- */
function parseCSV(text){
 const rows=[];let row=[],field='',inQ=false;
 // delimitador: usa ';' se presente no cabeçalho, senão ',' (padrão BR: ';' + decimais com ',')
 const delim=text.slice(0,text.indexOf('\n')>-1?text.indexOf('\n'):text.length).includes(';')?';':',';
 for(let i=0;i<text.length;i++){const c=text[i];
  if(inQ){if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else inQ=false}else field+=c}
  else if(c==='"')inQ=true;
  else if(c===delim){row.push(field);field=''}
  else if(c==='\n'){row.push(field);field='';if(row.some(x=>x!==''))rows.push(row);row=[]}
  else if(c==='\r'){}
  else field+=c}
 if(field!==''||row.length){row.push(field);if(row.some(x=>x!==''))rows.push(row)}
 return rows;
}
function numBR(v){if(v==null)return 0;v=String(v).trim();if(!v)return 0;
 v=v.replace(/[R$\s]/g,'');const hasC=v.includes(','),hasP=v.includes('.');
 if(hasC&&hasP)v=v.replace(/\./g,'').replace(',','.');
 else if(hasC)v=v.replace(',','.');
 return parseFloat(v)||0}
function importCSV(inp,kind){
 if(!pode('*'))return alert('Somente o Gerente de A&B importa cadastros.');
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  const rows=parseCSV(r.result);if(rows.length<2)return alert('CSV vazio ou sem linhas de dados.');
  const head=rows[0].map(h=>h.trim().toLowerCase());
  let ok=0,skip=0;
  rows.slice(1).forEach(cols=>{
   const o={};head.forEach((h,i)=>o[h]=cols[i]);
   if(kind==='mats'){
    const nome=(o['material']||o['nome']||o['descricao']||'').trim();
    if(!nome){skip++;return}
    const existe=S.mats.some(m=>m.nome.toLowerCase()===nome.toLowerCase());
    if(existe){skip++;return}
    S.mats.push({id:uid(),nome,un:(o['unidade']||o['un']||'un').trim(),custo:numBR(o['custo']||o['custo unitario']||o['custo_unitario']||o['preco']||o['valor'])});
    ok++;
   }else{
    const nome=(o['fornecedor']||o['nome']||o['razao social']||'').trim();
    if(!nome){skip++;return}
    const existe=S.forns.some(m=>m.nome.toLowerCase()===nome.toLowerCase());
    if(existe){skip++;return}
    S.forns.push({id:uid(),nome,doc:(o['documento']||o['cnpj']||o['cpf']||'').trim(),contato:(o['contato']||o['telefone']||o['email']||'').trim(),banco:(o['dados bancarios']||o['banco']||o['pix']||'').trim()});
    ok++;
   }});
  aud('Importação CSV',`${kind}: ${ok} importados, ${skip} ignorados (duplicados/vazios)`);
  alert(`Importação concluída: ${ok} adicionados, ${skip} ignorados (duplicado ou sem nome).`);
  save();render();
 };
 r.readAsText(f,'utf-8');
}

 p.dedFaltaGrave=parseFloat(document.getElementById('qDedG').value)||0.6;

 p.tarifaKwh=parseFloat(document.getElementById('qKwh').value)||1.20;
 const en=document.getElementById('qEmp').value.trim(),cn=document.getElementById('qCnpj').value.trim();
 if(en)p.empresaParque={nome:en,cnpj:cn||p.empresaParque.cnpj};
 aud('Parâmetros','Modelo atualizado (valores anteriores registrados na trilha)');
 save();render();
}

/* ---------- modal ---------- */
function openModal(html){const d=document.createElement('div');d.className='modalbg';d.id='mbg';d.innerHTML=`<div class="modal">${html}</div>`;d.onclick=e=>{if(e.target===d)closeModal()};document.body.appendChild(d)}
function closeModal(){document.getElementById('mbg')?.remove()}

/* ---------- router body ---------- */
function bodyHTML(){
 switch(TAB){
  case 'painel':return painelHTML();
  case 'lanc':return lancHTML()+equipeHTML();
  case 'equipe':return equipeHTML();
  case 'desp':return despHTML();
  case 'fin':return finHTML();
  case 'rep':return repasseHTML();
  case 'apur':return apurHTML();
  case 'rel':return relHTML();
  case 'cad':return cadHTML();
  case 'param':return paramHTML();
  default:return painelHTML();
 }
}
(async function boot(){
 if(location.hostname.includes('hf.space')||location.hostname.includes('vercel.app')||location.hostname.includes('onrender')){
  try{const r=await fetch('/data');if(r.ok){const d=await r.json();if(d&&d.pdvs){S=d;CLOUD_ENABLED=true;localStorage.setItem(PKEY,JSON.stringify(S));render();return}}}catch(e){}
 }
 load();render();
})();
</script>
